name: CodeQL

# Security scanning with results uploaded to the repository's Security tab (code
# scanning). FlintLauncher is pure managed code (the libc/kernel32 P/Invoke stubs
# compile together on every OS; no per-OS file splits), so a single-OS analysis
# sees the whole surface. CodeQL is free on public repositories.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly sweep even without code motion: newly published queries and
    # security-extended findings surface without waiting for the next commit.
    - cron: '23 4 * * 1'

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Required to upload the SARIF results to the Security tab.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      # The build below executes Core's javac/jar targets; pin the JDK the same
      # way CI does.
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # security-extended adds the broader security query suite on top of the
          # default set - the right default for a launcher that parses untrusted
          # input from the wild: third-party API wire models, NBT world files,
          # modpack TOML and downloaded archives.
          queries: security-extended

      - name: Build
        # A real build instead of autobuild so the source-generated JSON/NBT
        # contexts and the AOT-annotated surface end up in the analyzed database.
        run: dotnet build FlintLauncher.slnx -c Release --nologo

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  # PR gate for vulnerable dependency changes (GitHub Advisory Database diff between
  # base and head). Requires the repository's Dependency graph to be enabled — the
  # toggle lives only in the repo settings UI (Settings → Code security); the API
  # silently ignores dependency_graph_enabled for user-owned repositories.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
